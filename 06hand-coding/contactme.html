    <!--start the main content-->
    <main>
        <h1>Let’s Work Together</h1>

        <form method="get" action="thanks.html" class="myform">
            <fieldset>
                <legend>Client Information</legend>
                <label> First Name : <input type="text" name="first_name" required></label>

                <label> Last Name :<input type="text" name="last_name" required></label>

                <label> Number : <input type="tel" name="phone" required placeholder="555-555-555"> </label>
                
                 <label>Email : <input type="email" name="Email" required placeholder="Username@gmail.com"> </label>

            </fieldset> <!-- seprete box -->
            
            <fieldset>
                <legend> What Do You Need? </legend>
                
                <label> <input type="radio" value="branding" name="service"> Branding & Logo Design </label>

                <label> <input type="radio" value="web" name="service"> Website Design</label>

                <label> <input type="radio" value="social" name="service"> Social Media Graphics</label>

                <label> <input type="radio" value="print" name="service"> Print Design</label>

                <label> <input type="radio" value="other" name="service"> Other</label>

            </fieldset>
               
            <!-- seprete box -->
            <fieldset>
                <legend>Preferred Contact Method</legend>
                <label> <input type="checkbox"  name="contact_method" value="email"> Email</label>
        
                <label> <input type="checkbox"  name="contact_method" value="phone"> Phone</label>

                <label> <input type="checkbox"  name="contact_method" value="zoom"> Zoom Meeting</label>

                <label> <input type="checkbox"  name="contact_method" value="irl"> In Person</label> 

                <label> Project Timeline:
                    
                    <select name="time">
                        <option value="none"> please select an option </option>
                        <option value="asap"> ASAP</option>
                        <option value="week"> Within 2 weeks </option>
                        <option value="afternoon"> Within a Month </option>
                        <option value="Flexible"> Flexible </option>
                    </select>

                </label>
                
            </fieldset>
             <label>Tell Me About Your Project:
                    <textarea name="comments"></textarea>
                </label>

                <input type="submit" value=" Send Request">
        </form>

    </main>
